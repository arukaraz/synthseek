name: Deploy Beta Docs

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build the beta docs from."
        required: true
        type: string

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-docs-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to publish main as the beta
        if: inputs.ref == '' && github.ref_name == 'main'
        run: |
          echo "::error::Dispatch this workflow on the beta branch, not main."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: sites/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sites

      - name: Run checks
        run: npm run check
        working-directory: sites
        env:
          PUBLIC_DOCS_CHANNEL: beta

      - name: Build the beta docs
        run: npm run build:docs
        working-directory: sites
        env:
          PUBLIC_DOCS_CHANNEL: beta

      - name: Deploy the beta docs
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites
          command: pages deploy docs/dist --project-name=synthseek-docs --branch=beta
