name: Deploy Sites

on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - "changelog.json"
      - ".github/workflows/sites.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: sites/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sites

      - name: Run checks
        run: npm run check
        working-directory: sites

      - name: Build both sites
        run: npm run build
        working-directory: sites

      - name: Deploy docs
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites
          command: pages deploy docs/dist --project-name=synthseek-docs --branch=main

      - name: Deploy landing
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites
          command: pages deploy landing/dist --project-name=synthseek-landing --branch=main
