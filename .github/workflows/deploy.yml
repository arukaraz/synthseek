name: Build and Deploy Docker Image

on:
  repository_dispatch:
    types: [server-release]

  workflow_dispatch:
    inputs:
      server_version:
        description: "Server version (e.g., v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease (tag with label, skip :latest)"
        required: false
        default: false
        type: boolean
      prerelease_name:
        description: "Prerelease label. Defaults to 'beta'. Example: prerelease-name"
        required: false
        default: ""
        type: string
      skip_cache:
        description: "Skip Docker layer cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      prerelease_label: ${{ steps.version.outputs.prerelease_label }}
      image_tags: ${{ steps.tags.outputs.image_tags }}
      skip_cache: ${{ steps.tags.outputs.skip_cache }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version and source
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
            TAG="${{ github.event.client_payload.tag }}"
            SERVER_REPO="${{ github.event.client_payload.server_repo }}"
            ARTIFACT_NAME="${{ github.event.client_payload.artifact_name }}"
            COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"
            PRERELEASE="${{ github.event.client_payload.prerelease }}"
            PRERELEASE_NAME="${{ github.event.client_payload.prerelease_name }}"

            echo "Triggered by server release"
          else
            INPUT_VERSION="${{ github.event.inputs.server_version }}"
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            SERVER_REPO="arukaraz/synthseek-server"
            ARTIFACT_NAME="server-bundle-v${VERSION}.tar.gz"
            COMMIT_SHA="manual"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            PRERELEASE_NAME="${{ github.event.inputs.prerelease_name }}"

            echo "Manual trigger"
          fi

          if [ "$PRERELEASE" != "true" ]; then
            PRERELEASE="false"
            PRERELEASE_LABEL=""
          else
            PRERELEASE="true"
            if [ -z "$PRERELEASE_NAME" ]; then
              PRERELEASE_LABEL="beta"
            else
              PRERELEASE_LABEL="$PRERELEASE_NAME"
            fi
          fi

          if [ -n "$PRERELEASE_LABEL" ]; then
            VERSION="${VERSION%-$PRERELEASE_LABEL}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "server_repo=$SERVER_REPO" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "prerelease_label=$PRERELEASE_LABEL" >> $GITHUB_OUTPUT

          echo "Building Docker image for server version: $VERSION (prerelease: $PRERELEASE, label: '$PRERELEASE_LABEL')"

      - name: Compute image tag list
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          LABEL="${{ steps.version.outputs.prerelease_label }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [ "$PRERELEASE" = "true" ]; then
            TAGS="${IMAGE}:v${VERSION}-${LABEL} ${IMAGE}:${LABEL}"
          else
            TAGS="${IMAGE}:v${VERSION} ${IMAGE}:${VERSION} ${IMAGE}:latest"
          fi

          echo "image_tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Manifest tags: $TAGS"

          if [ "${{ github.event.inputs.skip_cache }}" = "true" ]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
          else
            echo "skip_cache=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Download server artifact from release
        env:
          GH_TOKEN: ${{ secrets.SERVER_REPO_PAT }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SERVER_REPO="${{ steps.version.outputs.server_repo }}"

          echo "Downloading from: $SERVER_REPO release $TAG"

          mkdir -p artifacts
          gh release download "$TAG" \
            --repo "$SERVER_REPO" \
            --pattern "server-bundle-*.tar.gz" \
            --dir ./artifacts

          echo "Downloaded files:"
          ls -lh ./artifacts/

          mkdir -p server-build
          tar -xzvf ./artifacts/server-bundle-*.tar.gz -C ./server-build --strip-components=1

          echo ""
          echo "Server artifact contents:"
          ls -la ./server-build/

          echo ""
          echo "Verifying artifact structure..."

          if [ ! -f "./server-build/dist/index.cjs" ]; then
            echo "Error: dist/index.cjs not found"
            exit 1
          fi
          echo "  [OK] dist/index.cjs exists"

          if [ ! -f "./server-build/db/schema.prisma" ]; then
            echo "Error: db/schema.prisma not found"
            exit 1
          fi
          echo "  [OK] db/schema.prisma exists"

          if [ ! -f "./server-build/package-lock.json" ]; then
            echo "Error: package-lock.json not found (needed to rebuild native deps per arch)"
            exit 1
          fi
          echo "  [OK] package-lock.json exists"

          if [ -f "./server-build/VERSION" ]; then
            echo ""
            echo "Server version: $(cat ./server-build/VERSION)"
          fi

          echo ""
          echo "Server artifact verified successfully"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Syncing package.json to version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo ""
          echo "Updated package.json:"
          grep '"version"' package.json

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify frontend build
        run: |
          echo "Next.js build output:"
          ls -la .next/

          if [ ! -d ".next/standalone" ]; then
            echo "Error: .next/standalone not found"
            exit 1
          fi
          echo "  [OK] standalone directory exists"

          if [ ! -d ".next/static" ]; then
            echo "Error: .next/static not found"
            exit 1
          fi
          echo "  [OK] static directory exists"

          echo ""
          echo "Frontend build verified"

      - name: Commit version sync
        if: steps.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m "chore: sync version to $VERSION [skip ci]"
          git push

      - name: Assemble Docker build context
        run: |
          echo "Assembling Docker build context..."

          mkdir -p docker-context/server
          mkdir -p docker-context/web
          mkdir -p docker-context/docker

          cp -r ./server-build/* docker-context/server/

          cp -r .next/standalone docker-context/web/standalone
          cp -r .next/static docker-context/web/static
          if [ -d "public" ]; then
            cp -r public docker-context/web/public
          else
            mkdir -p docker-context/web/public
            touch docker-context/web/public/.keep
          fi

          cp docker/start.sh docker-context/docker/
          chmod +x docker-context/docker/start.sh

          cp Dockerfile docker-context/Dockerfile

          echo ""
          echo "Docker context structure:"
          find docker-context -maxdepth 2 -type d | head -30

      - name: Upload Docker build context
        uses: actions/upload-artifact@v4
        with:
          name: docker-context
          path: docker-context
          retention-days: 1
          include-hidden-files: true

  build:
    needs: [prepare]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Download Docker build context
        uses: actions/download-artifact@v4
        with:
          name: docker-context
          path: docker-context

      - name: Restore start.sh permissions
        run: chmod +x docker-context/docker/start.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: synthseek-smoke:${{ matrix.arch }}
          cache-from: ${{ needs.prepare.outputs.skip_cache != 'true' && format('type=gha,scope={0}', matrix.arch) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Smoke test (health + arch assertion)
        run: |
          ARCH="${{ matrix.arch }}"
          IMAGE="synthseek-smoke:${ARCH}"

          echo "Starting container from $IMAGE"
          CID="$(docker run -d -p 4401:4401 -e AUTH_SECRET=ci_smoke_test_dummy_secret_at_least_32_chars_long_0000 -e SKIP_HEALTH_CHECKS=true "$IMAGE")"

          cleanup() {
            echo "--- container logs ---"
            docker logs "$CID" 2>&1 | tail -50 || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for /api/health to report healthy..."
          HEALTH_JSON=""
          READY="false"
          for i in $(seq 1 60); do
            if HEALTH_JSON="$(curl -fsS http://localhost:4401/api/health 2>/dev/null)"; then
              READY="true"
              break
            fi
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "Error: server never became healthy within timeout"
            exit 1
          fi

          echo "Health response: $HEALTH_JSON"

          REPORTED_ARCH="$(echo "$HEALTH_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).runtime.arch))")"
          echo "Reported runtime.arch: $REPORTED_ARCH"

          EXPECTED_ARCH="${ARCH}"
          if [ "$ARCH" = "amd64" ]; then EXPECTED_ARCH="x64"; fi

          if [ "$REPORTED_ARCH" != "$EXPECTED_ARCH" ]; then
            echo "Error: arch mismatch. Expected $EXPECTED_ARCH (matrix $ARCH), got $REPORTED_ARCH"
            exit 1
          fi

          echo "Smoke test passed: healthy and arch is $REPORTED_ARCH"

      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p digests
          DIGEST="${{ steps.push.outputs.digest }}"
          echo "${DIGEST}" > "digests/${{ matrix.arch }}.txt"
          echo "Digest for ${{ matrix.arch }}: ${DIGEST}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          AMD64_DIGEST="$(cat digests/amd64.txt)"
          ARM64_DIGEST="$(cat digests/arm64.txt)"

          echo "amd64 digest: $AMD64_DIGEST"
          echo "arm64 digest: $ARM64_DIGEST"

          read -ra TAGS <<< "${{ needs.prepare.outputs.image_tags }}"
          TAG_ARGS=()
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS+=(-t "$TAG")
          done

          echo "Creating manifest list with tags: ${{ needs.prepare.outputs.image_tags }}"
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Publish per-arch debug tags
        if: needs.prepare.outputs.prerelease != 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          AMD64_DIGEST="$(cat digests/amd64.txt)"
          ARM64_DIGEST="$(cat digests/arm64.txt)"

          echo "Publishing per-arch debug tags"
          docker buildx imagetools create -t "${IMAGE}:v${VERSION}-amd64" "${IMAGE}@${AMD64_DIGEST}"
          docker buildx imagetools create -t "${IMAGE}:v${VERSION}-arm64" "${IMAGE}@${ARM64_DIGEST}"

      - name: Verify manifest platforms
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          LABEL="${{ needs.prepare.outputs.prerelease_label }}"

          if [ "$PRERELEASE" = "true" ]; then
            INSPECT_TAG="v${VERSION}-${LABEL}"
          else
            INSPECT_TAG="v${VERSION}"
          fi

          echo "Inspecting ${IMAGE}:${INSPECT_TAG}"
          INSPECT="$(docker buildx imagetools inspect "${IMAGE}:${INSPECT_TAG}")"
          echo "$INSPECT"

          if ! echo "$INSPECT" | grep -q "linux/amd64"; then
            echo "Error: linux/amd64 missing from manifest"
            exit 1
          fi
          if ! echo "$INSPECT" | grep -q "linux/arm64"; then
            echo "Error: linux/arm64 missing from manifest"
            exit 1
          fi
          echo "Manifest verified: linux/amd64 and linux/arm64 both present"

      - name: Create deployment summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          LABEL="${{ needs.prepare.outputs.prerelease_label }}"
          AMD64_DIGEST="$(cat digests/amd64.txt)"
          ARM64_DIGEST="$(cat digests/arm64.txt)"

          if [ "$PRERELEASE" = "true" ]; then
            PRIMARY_TAG="v${VERSION}-${LABEL}"
            TAG_ROWS="| \`v${VERSION}-${LABEL}\` | linux/amd64, linux/arm64 |\n| \`${LABEL}\` | linux/amd64, linux/arm64 |"
          else
            PRIMARY_TAG="v${VERSION}"
            TAG_ROWS="| \`v${VERSION}\` | linux/amd64, linux/arm64 |\n| \`${VERSION}\` | linux/amd64, linux/arm64 |\n| \`latest\` | linux/amd64, linux/arm64 |"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Synthseek v${VERSION}${PRERELEASE:+ (prerelease)}

          \`\`\`
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PRIMARY_TAG}
          \`\`\`

          | Tag | Platforms |
          |-----|-----------|
          $(printf '%b\n' "$TAG_ROWS")

          | Arch | Digest |
          |------|--------|
          | linux/amd64 | \`${AMD64_DIGEST}\` |
          | linux/arm64 | \`${ARM64_DIGEST}\` |

          ---

          **Version**: v${VERSION} | **Commit**: \`${{ needs.prepare.outputs.commit_sha }}\` | **Prerelease**: ${PRERELEASE}
          EOF
