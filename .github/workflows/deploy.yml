name: Build and Deploy Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Server release tag to build (e.g., v3.0.0, v3.0.0-beta-2, v3.0.0-pre-release). The branch is the one this workflow runs from."
        required: true
        type: string
      channel:
        description: "stable publishes v<version>, <version> and :latest. beta publishes only the tag itself and the beta docs. pre-release publishes only :<image_label>."
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - pre-release
      image_label:
        description: "Image tag of a pre-release (pre-release channel only)."
        required: false
        default: ""
        type: string
      commit_sha:
        description: "Server commit the bundle was built from."
        required: false
        default: "manual"
        type: string
      skip_cache:
        description: "Skip Docker layer cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      web_sha: ${{ steps.version.outputs.web_sha }}
      channel: ${{ steps.version.outputs.channel }}
      primary_tag: ${{ steps.tags.outputs.primary_tag }}
      image_tags: ${{ steps.tags.outputs.image_tags }}
      skip_cache: ${{ steps.tags.outputs.skip_cache }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version and source
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          CHANNEL: ${{ github.event.inputs.channel }}
          IMAGE_LABEL: ${{ github.event.inputs.image_label }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG="v${INPUT_TAG#v}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"

          case "$CHANNEL" in
            stable)
              if [ "$TAG" != "v${VERSION}" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
                echo "A stable deploy builds a plain vX.Y.Z tag from $DEFAULT_BRANCH."
                exit 1
              fi
              ;;
            beta)
              if [ "$TAG" = "v${VERSION}" ]; then
                echo "A beta deploy builds a v${VERSION}-beta tag, not $TAG."
                exit 1
              fi
              ;;
            pre-release)
              if [ -z "$IMAGE_LABEL" ]; then
                echo "A pre-release deploy needs the image_label it publishes."
                exit 1
              fi
              ;;
          esac

          if [ "$CHANNEL" != "pre-release" ] && ! node -e "process.exit(require('./changelog.json').versions[0].version === process.argv[1] ? 0 : 1)" "$VERSION"; then
            echo "changelog.json on $REF_NAME does not open with a $VERSION entry; the image bundles it for the What's new modal and the sites read it. Commit the patch notes before the release."
            exit 1
          fi

          WEB_SHA="$(git rev-parse HEAD)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "server_repo=arukaraz/synthseek-server" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "web_sha=$WEB_SHA" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "image_label=$IMAGE_LABEL" >> $GITHUB_OUTPUT

          echo "Building $TAG (version $VERSION, channel $CHANNEL, web: $REF_NAME at $WEB_SHA)"

      - name: Compute image tag list
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          LABEL: ${{ steps.version.outputs.image_label }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          case "$CHANNEL" in
            stable)
              PRIMARY="v${VERSION}"
              TAGS="${IMAGE}:v${VERSION} ${IMAGE}:${VERSION} ${IMAGE}:latest"
              ;;
            beta)
              PRIMARY="${TAG}"
              TAGS="${IMAGE}:${TAG}"
              ;;
            pre-release)
              PRIMARY="${LABEL}"
              TAGS="${IMAGE}:${LABEL}"
              ;;
          esac

          echo "primary_tag=$PRIMARY" >> $GITHUB_OUTPUT
          echo "image_tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Manifest tags: $TAGS"

          if [ "${{ github.event.inputs.skip_cache }}" = "true" ]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
          else
            echo "skip_cache=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Download server artifact from release
        env:
          GH_TOKEN: ${{ secrets.SERVER_REPO_PAT }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SERVER_REPO="${{ steps.version.outputs.server_repo }}"

          echo "Downloading from: $SERVER_REPO release $TAG"

          mkdir -p artifacts
          gh release download "$TAG" \
            --repo "$SERVER_REPO" \
            --pattern "server-bundle-*.tar.gz" \
            --dir ./artifacts

          echo "Downloaded files:"
          ls -lh ./artifacts/

          mkdir -p server-build
          tar -xzvf ./artifacts/server-bundle-*.tar.gz -C ./server-build --strip-components=1

          echo ""
          echo "Server artifact contents:"
          ls -la ./server-build/

          echo ""
          echo "Verifying artifact structure..."

          if [ ! -f "./server-build/dist/index.cjs" ]; then
            echo "Error: dist/index.cjs not found"
            exit 1
          fi
          echo "  [OK] dist/index.cjs exists"

          if [ ! -f "./server-build/db/schema.prisma" ]; then
            echo "Error: db/schema.prisma not found"
            exit 1
          fi
          echo "  [OK] db/schema.prisma exists"

          if [ ! -f "./server-build/package-lock.json" ]; then
            echo "Error: package-lock.json not found (needed to rebuild native deps per arch)"
            exit 1
          fi
          echo "  [OK] package-lock.json exists"

          if [ -f "./server-build/VERSION" ]; then
            echo ""
            echo "Server version: $(cat ./server-build/VERSION)"
          fi

          echo ""
          echo "Server artifact verified successfully"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Syncing package.json to version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo ""
          echo "Updated package.json:"
          grep '"version"' package.json

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify frontend build
        run: |
          echo "Next.js build output:"
          ls -la .next/

          if [ ! -d ".next/standalone" ]; then
            echo "Error: .next/standalone not found"
            exit 1
          fi
          echo "  [OK] standalone directory exists"

          if [ ! -d ".next/static" ]; then
            echo "Error: .next/static not found"
            exit 1
          fi
          echo "  [OK] static directory exists"

          echo ""
          echo "Frontend build verified"

      - name: Commit version sync
        if: steps.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m "chore: sync version to $VERSION [skip ci]"
          git push

      - name: Assemble Docker build context
        run: |
          echo "Assembling Docker build context..."

          mkdir -p docker-context/server
          mkdir -p docker-context/web
          mkdir -p docker-context/docker

          cp -r ./server-build/* docker-context/server/

          cp -r .next/standalone docker-context/web/standalone
          cp -r .next/static docker-context/web/static
          if [ -d "public" ]; then
            cp -r public docker-context/web/public
          else
            mkdir -p docker-context/web/public
            touch docker-context/web/public/.keep
          fi

          cp docker/start.sh docker-context/docker/
          cp docker/append-peer-address.mjs docker-context/docker/
          chmod +x docker-context/docker/start.sh

          cp Dockerfile docker-context/Dockerfile

          docker/bundle-release-notes.sh . "${{ steps.version.outputs.version }}" docker-context/whats-new

          echo ""
          echo "Docker context structure:"
          find docker-context -maxdepth 2 -type d | head -30

      - name: Upload Docker build context
        uses: actions/upload-artifact@v4
        with:
          name: docker-context
          path: docker-context
          retention-days: 1
          include-hidden-files: true

  build:
    needs: [prepare]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Download Docker build context
        uses: actions/download-artifact@v4
        with:
          name: docker-context
          path: docker-context

      - name: Restore start.sh permissions
        run: chmod +x docker-context/docker/start.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: synthseek-smoke:${{ matrix.arch }}
          cache-from: ${{ needs.prepare.outputs.skip_cache != 'true' && format('type=gha,scope={0}', matrix.arch) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Smoke test (health + arch assertion)
        run: |
          ARCH="${{ matrix.arch }}"
          IMAGE="synthseek-smoke:${ARCH}"

          echo "Starting container from $IMAGE"
          CID="$(docker run -d -p 4401:4401 -e AUTH_SECRET=ci_smoke_test_dummy_secret_at_least_32_chars_long_0000 -e SKIP_HEALTH_CHECKS=true -e PUBLIC_BASE_URL=https://smoke-test.invalid "$IMAGE")"

          cleanup() {
            echo "--- container logs ---"
            docker logs "$CID" 2>&1 | tail -50 || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for /api/health to report healthy..."
          HEALTH_JSON=""
          READY="false"
          for i in $(seq 1 60); do
            if HEALTH_JSON="$(curl -fsS http://localhost:4401/api/health 2>/dev/null)"; then
              READY="true"
              break
            fi
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "Error: server never became healthy within timeout"
            exit 1
          fi

          echo "Health response: $HEALTH_JSON"

          REPORTED_ARCH="$(echo "$HEALTH_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).runtime.arch))")"
          echo "Reported runtime.arch: $REPORTED_ARCH"

          EXPECTED_ARCH="${ARCH}"
          if [ "$ARCH" = "amd64" ]; then EXPECTED_ARCH="x64"; fi

          if [ "$REPORTED_ARCH" != "$EXPECTED_ARCH" ]; then
            echo "Error: arch mismatch. Expected $EXPECTED_ARCH (matrix $ARCH), got $REPORTED_ARCH"
            exit 1
          fi

          if ! docker exec -w /app/server "$CID" node -e "const s = require('sharp'); s({ create: { width: 8, height: 8, channels: 3, background: '#000' } }).resize({ width: 4 }).webp().toBuffer().then((b) => console.log('sharp resizes, libvips ' + s.versions.vips + ' on ' + process.arch + ', ' + b.length + ' bytes'))"; then
            echo "Error: the server cannot resize with sharp on $ARCH, so every sized cover would fail back to the original"
            exit 1
          fi

          echo "Smoke test passed: healthy, arch is $REPORTED_ARCH and sharp loads"

      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p digests
          DIGEST="${{ steps.push.outputs.digest }}"
          echo "${DIGEST}" > "digests/${{ matrix.arch }}.txt"
          echo "Digest for ${{ matrix.arch }}: ${DIGEST}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          AMD64_DIGEST="$(cat digests/amd64.txt)"
          ARM64_DIGEST="$(cat digests/arm64.txt)"

          echo "amd64 digest: $AMD64_DIGEST"
          echo "arm64 digest: $ARM64_DIGEST"

          read -ra TAGS <<< "${{ needs.prepare.outputs.image_tags }}"
          TAG_ARGS=()
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS+=(-t "$TAG")
          done

          echo "Creating manifest list with tags: ${{ needs.prepare.outputs.image_tags }}"
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Verify manifest platforms
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          INSPECT_TAG="${{ needs.prepare.outputs.primary_tag }}"

          echo "Inspecting ${IMAGE}:${INSPECT_TAG}"
          INSPECT="$(docker buildx imagetools inspect "${IMAGE}:${INSPECT_TAG}")"
          echo "$INSPECT"

          if ! echo "$INSPECT" | grep -q "linux/amd64"; then
            echo "Error: linux/amd64 missing from manifest"
            exit 1
          fi
          if ! echo "$INSPECT" | grep -q "linux/arm64"; then
            echo "Error: linux/arm64 missing from manifest"
            exit 1
          fi
          echo "Manifest verified: linux/amd64 and linux/arm64 both present"

      - name: Cleanup orphaned untagged images
        if: needs.prepare.outputs.channel == 'stable'
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          owner: ${{ github.repository_owner }}
          packages: synthseek
          delete-untagged: true
          validate: true

      - name: Create deployment summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          PRIMARY_TAG="${{ needs.prepare.outputs.primary_tag }}"
          AMD64_DIGEST="$(cat digests/amd64.txt)"
          ARM64_DIGEST="$(cat digests/arm64.txt)"

          TAG_ROWS=""
          for IMAGE_TAG in ${{ needs.prepare.outputs.image_tags }}; do
            TAG_ROWS="${TAG_ROWS}| \`${IMAGE_TAG##*:}\` | linux/amd64, linux/arm64 |\n"
          done

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Synthseek ${PRIMARY_TAG} (${CHANNEL})

          \`\`\`
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PRIMARY_TAG}
          \`\`\`

          | Tag | Platforms |
          |-----|-----------|
          $(printf '%b' "$TAG_ROWS")

          | Arch | Digest |
          |------|--------|
          | linux/amd64 | \`${AMD64_DIGEST}\` |
          | linux/arm64 | \`${ARM64_DIGEST}\` |

          ---

          **Version**: v${VERSION} | **Server commit**: \`${{ needs.prepare.outputs.commit_sha }}\` | **Web commit**: \`${{ needs.prepare.outputs.web_sha }}\` | **Channel**: ${CHANNEL}
          EOF

  sites:
    needs: [prepare, merge]
    if: needs.prepare.outputs.channel == 'stable'
    uses: ./.github/workflows/sites.yml
    with:
      ref: ${{ needs.prepare.outputs.web_sha }}
    secrets: inherit

  beta-docs:
    needs: [prepare, merge]
    if: needs.prepare.outputs.channel == 'beta'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.web_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: sites/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sites

      - name: Run checks
        run: npm run check
        working-directory: sites
        env:
          PUBLIC_DOCS_CHANNEL: beta

      - name: Build the beta docs
        run: npm run build:docs
        working-directory: sites
        env:
          PUBLIC_DOCS_CHANNEL: beta

      - name: Deploy the beta docs
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites
          command: pages deploy docs/dist --project-name=synthseek-docs --branch=beta
