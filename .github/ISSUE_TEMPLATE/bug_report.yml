name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Synthseek Version
      description: Docker image tag or version number, as shown under Settings, then About
      placeholder: "2.6.1"
    validations:
      required: true

  - type: input
    id: slskd-version
    attributes:
      label: slskd Version
      description: Your slskd version (if relevant)
      placeholder: "0.21.0"

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other

  - type: checkboxes
    id: debug-logs
    attributes:
      label: Before you attach the logs
      description: Logs at the default level rarely say why something failed, so this is the one step that decides whether a bug can be diagnosed at all.
      options:
        - label: I set the log level to DEBUG under Settings, then Logs, and reproduced the problem after that
          required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs at DEBUG level
      description: |
        Paste the server logs covering the moment the problem happened, from Settings, then Logs, or from `docker logs synthseek`.
        Include the browser console too if the problem is something you saw on screen.
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, config, etc.)
