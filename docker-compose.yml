services:
  synthseek:
    image: ghcr.io/arukaraz/synthseek:latest
    container_name: synthseek
    restart: unless-stopped

    ports:
      - "4400:${WEB_UI_PORT:-4400}"

    volumes:
      - ./data:/data
      - /path/to/your/music:/music
      - /path/to/slskd/downloads/complete:/downloads

    environment:
      - PUID=1000
      - PGID=1000

      # Session signing secret. Generate once with: openssl rand -base64 48
      # Changing this value invalidates all active login sessions.
      - AUTH_SECRET=your_generated_secret_here

      # HTTPS URL of your instance.
      - PUBLIC_BASE_URL=https://synthseek.yourdomain.com

      # Disable Beets post-download import (default: true)
      # - ENABLE_BEETS_IMPORT=false

      # Override the web UI port (default: 4400). Also update the ports mapping above.
      # - WEB_UI_PORT=4400

      # Upgrading from v1.x to v2.0.0? You MUST add your existing integration values below for the
      # first boot only. Synthseek will migrate them into the Settings database automatically.
      # After the first successful boot you can remove them — everything lives in Settings from then on.
      # New installs can ignore this section entirely and configure everything from the Settings UI.

      # - ADMIN_MIGRATION_EMAIL=you@example.com
      # - ADMIN_MIGRATION_USERNAME=admin
      # - ADMIN_MIGRATION_PASSWORD=choose-a-strong-password
      # - SLSKD_API_URL=http://slskd:5030
      # - SLSKD_API_KEY=your_slskd_api_key
      # - PLEX_URL=http://plex:32400
      # - PLEX_TOKEN=your_plex_token
      # - LASTFM_API_KEY=your_lastfm_api_key
      # - FANART_API_KEY=your_fanart_api_key
      # - ACOUSTID_API_KEY=your_acoustid_api_key
      # - MUSICBRAINZ_CONTACT_EMAIL=your@email.com

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4401/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
